services:
  postgres:
    image: postgres:17
    container_name: taxiuz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxiuz
      POSTGRES_PASSWORD: taxiuz_dev
      POSTGRES_DB: taxiuz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
